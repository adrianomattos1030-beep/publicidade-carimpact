<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARIMPACT - Totem</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif}
body{background:#0B0E13;color:#fff;overflow:hidden}
.slide{display:none}.slide.active{display:flex}
.progress{animation:prog 8s linear forwards}
@keyframes prog{from{width:0%}to{width:100%}}
</style>
</head>
<body class="h-screen flex flex-col">
<header class="h-[10vh] bg-[#0D1219] border-b border-white/10 flex items-center justify-between px-6">
  <img src="./carimpact_logo_transparente.png" class="h-8 object-contain" alt="CARIMPACT">
  <div class="flex items-center gap-4">
    <div id="clock" class="text-[#FFC400] font-bold text-xl tabular-nums">00:00:00</div>
    <div id="date" class="text-white/60 text-xs uppercase">Carregando...</div>
  </div>
</header>

<main class="flex-1 grid grid-cols-12 gap-3 p-3 h-[90vh]">
  <!-- ESQUERDA CARROSSEL 4 SLIDES -->
  <div class="col-span-8 relative bg-black rounded-2xl overflow-hidden border border-white/10">
    <div id="carousel" class="h-full w-full relative">
      <!-- SLIDES - troque os src pelos seus arquivos -->
      <div class="slide active h-full w-full items-center justify-center bg-black"><img src="./CarImpact_jpg.png" class="max-h-full max-w-full object-contain"></div>
      <div class="slide h-full w-full items-center justify-center bg-[#f5ebe0]"><img src="./aline.jpg1_2.jpg" class="max-h-full max-w-full object-contain"></div>
      <div class="slide h-full w-full items-center justify-center bg-white"><img src="./logo_16x9.png" class="max-h-full max-w-full object-contain"></div>
      <div class="slide h-full w-full items-center justify-center"><img src="./weather_forecast_portuguese.webp" class="h-full w-full object-cover"></div>
    </div>
    <!-- CONTROLES -->
    <button onclick="prev()" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/60 border border-white/20 flex items-center justify-center">‹</button>
    <button onclick="next()" class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/60 border border-white/20 flex items-center justify-center">›</button>
    <div class="absolute bottom-0 left-0 right-0 h-1 bg-white/10"><div id="bar" class="h-full bg-[#FFC400] progress"></div></div>
    <div class="absolute bottom-3 left-3 flex gap-1.5" id="dots"></div>
    <div id="label" class="absolute bottom-3 right-3 bg-black/70 px-2 py-1 rounded text-[10px]">1/4</div>
  </div>

  <!-- DIREITA CONTATO -->
  <div class="col-span-4 bg-[#121822] rounded-2xl border border-white/10 p-4 flex flex-col">
    <h2 class="font-black text-lg leading-none">FALE COM A GENTE</h2>
    <p class="text-white/50 text-[10px] mt-1">ESCANEIE O QR CODE</p>
    <div class="bg-white rounded-xl p-2 mt-3 flex items-center justify-center">
      <img src="./qr_carimpact_valid.png" class="w-full max-w-[200px] aspect-square object-contain">
    </div>
    <p class="text-[11px] text-white/70 mt-3 leading-snug">Anuncie sua marca NO CARRO da CARIMPACT e alcance milhares por dia em Campo Mourão</p>
    
    <div class="mt-3 bg-[#FFC400]/10 border border-[#FFC400]/30 rounded-xl p-3 text-center">
      <div class="text-[#FFC400] text-[10px] font-bold tracking-widest">PLANO TESTE</div>
      <div class="text-[#FFC400] font-black text-2xl">R$ 50/mês</div>
      <div class="text-white/60 text-[10px]">1 mês para testar</div>
    </div>

    <a href="https://wa.me/554498898523?text=Ol%C3%A1%20CARIMPACT!%20Quero%20anunciar%20no%20carro" target="_blank" class="mt-3 bg-[#25D366] hover:bg-[#1fb857] text-white font-bold rounded-xl h-11 flex items-center justify-center gap-2">WhatsApp</a>
    <div class="text-center mt-2 font-bold tabular-nums text-sm">(44) 98898-8523</div>
    
    <div class="mt-auto pt-3 border-t border-white/10 flex items-center gap-2">
      <img src="./carimpact_logo_transparente.png" class="h-5 object-contain opacity-80">
      <span class="text-[9px] text-white/40">SUA MARCA AQUI • ANUNCIE JÁ</span>
    </div>
  </div>
</main>

<script>
let i=0; const slides=document.querySelectorAll('.slide'); const total=slides.length;
function renderDots(){
  const d=document.getElementById('dots'); d.innerHTML='';
  for(let k=0;k<total;k++){ const b=document.createElement('div'); b.className='w-2 h-2 rounded-full '+(k===i?'bg-[#FFC400]':'bg-white/30'); b.onclick=()=>go(k); d.appendChild(b); }
}
function go(n){ i=n; if(i>=total)i=0; if(i<0)i=total-1; slides.forEach(s=>s.classList.remove('active')); slides[i].classList.add('active'); document.getElementById('label').innerText=(i<3?'ANÚNCIO ':'PREVISÃO ')+(i+1)+'/'+total; renderDots(); resetBar(); }
function next(){go(i+1)} function prev(){go(i-1)}
function resetBar(){ const b=document.getElementById('bar'); b.classList.remove('progress'); void b.offsetWidth; b.classList.add('progress'); }
setInterval(next,8000);
renderDots(); resetBar();
// Relógio
function tick(){ const n=new Date(); document.getElementById('clock').innerText=n.toLocaleTimeString('pt-BR'); document.getElementById('date').innerText=n.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}); } setInterval(tick,1000); tick();
</script>
</body>
</html>
